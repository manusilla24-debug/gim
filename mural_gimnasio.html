<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Gimnasio - Manuel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A25;
            --secondary: #2C2C2C;
            --bg: #1A1A1A;
            --surface: #262626;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border: #404040;
            --success: #4CAF50;
            --warning: #FFC107;
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 30px;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .routine-btn {
            padding: 12px 16px;
            margin: 8px 0;
            background-color: var(--secondary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 500;
        }

        .routine-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .routine-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        /* Main content */
        .main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .workout-panel {
            background-color: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            min-height: 400px;
        }

        .workout-panel h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .workout-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .exercise-item {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .exercise-item:hover {
            border-color: var(--primary);
            background-color: rgba(255, 107, 53, 0.05);
        }

        .exercise-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .exercise-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .exercise-inputs {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input {
            padding: 8px 12px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: rgba(255, 107, 53, 0.1);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: #D32F2F;
            color: white;
        }

        .btn-danger:hover {
            background-color: #B71C1C;
        }

        /* Progress History */
        .history-panel {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .history-panel h3 {
            margin-bottom: 15px;
            color: var(--primary);
        }

        .history-entry {
            background-color: var(--bg);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--primary);
            font-size: 0.9rem;
        }

        .history-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state p {
            margin-bottom: 10px;
        }

        /* Navigation */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .nav-tab:hover {
            color: var(--text-primary);
        }

        /* Hidden panels */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--success);
            color: white;
            padding: 15px 20px;
            border-radius: var(--radius);
            animation: slideUp 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.error {
            background-color: #D32F2F;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: 2;
            }

            .main {
                order: 1;
            }

            .workout-panel {
                padding: 15px;
            }

            header {
                padding: 30px 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 Mural de Gimnasio</h1>
            <p class="subtitle">Rastrea tu progreso - Manuel</p>
        </header>

        <div class="content">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="card">
                    <h2>Rutinas</h2>
                    <button class="routine-btn active" data-routine="0">Pecho & Tríceps</button>
                    <button class="routine-btn" data-routine="1">Espalda & Bíceps</button>
                    <button class="routine-btn" data-routine="2">Hombro & Abdominales</button>
                </div>

                <div class="card">
                    <h2>Próxima Rutina</h2>
                    <div id="nextRoutine" style="color: var(--primary); font-weight: 600; font-size: 1.1rem; margin-top: 10px;">
                        Cargando...
                    </div>
                </div>

                <div class="card">
                    <h2>Sesiones Totales</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-value" id="totalSessions">0</div>
                            <div class="stat-label">Entrenamientos</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Acciones</h2>
                    <button class="btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="exportData()">Descargar Datos</button>
                    <button class="btn-secondary" style="width: 100%;" onclick="showResetConfirm()">Borrar Todo</button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main">
                <div class="nav-tabs">
                    <button class="nav-tab active" data-panel="workout">Entrenamiento</button>
                    <button class="nav-tab" data-panel="history">Historial</button>
                </div>

                <!-- Workout Panel -->
                <div id="workout" class="panel active">
                    <div class="workout-panel">
                        <h2 id="routineTitle">Pecho & Tríceps</h2>
                        <p class="workout-date" id="workoutDate"></p>
                        
                        <div id="exercisesContainer"></div>

                        <div class="button-group">
                            <button class="btn-primary" onclick="saveWorkout()">💾 Guardar Entrenamiento</button>
                            <button class="btn-secondary" onclick="completeWorkout()">✓ Completar & Siguiente</button>
                        </div>
                    </div>
                </div>

                <!-- History Panel -->
                <div id="history" class="panel">
                    <div class="history-panel">
                        <h3>Historial de Entrenamientos</h3>
                        <div id="historyContainer">
                            <div class="empty-state">
                                <p>No hay entrenamientos registrados aún.</p>
                                <p style="font-size: 0.85rem;">Completa tu primer entrenamiento para ver el historial.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de las rutinas
        const routines = [
            {
                name: "Pecho & Tríceps",
                exercises: [
                    { name: "Press de Banca Inclinado (Multipower)", sets: 4, reps: 8 },
                    { name: "Aperturas en Máquina", sets: 3, reps: 10 },
                    { name: "Apertura en Polea", sets: 3, reps: 12 },
                    { name: "Extensión de Tríceps", sets: 3, reps: 10 },
                    { name: "Fondos", sets: 3, reps: 8 }
                ]
            },
            {
                name: "Espalda & Bíceps",
                exercises: [
                    { name: "Jalón al Pecho", sets: 4, reps: 8 },
                    { name: "Remo 1", sets: 4, reps: 8 },
                    { name: "Remo 2", sets: 3, reps: 10 },
                    { name: "Curl de Bíceps en Barra Z", sets: 3, reps: 10 },
                    { name: "Curl de Bíceps Martillo", sets: 3, reps: 12 }
                ]
            },
            {
                name: "Hombro & Abdominales",
                exercises: [
                    { name: "Press Militar", sets: 4, reps: 8 },
                    { name: "Elevaciones Laterales", sets: 3, reps: 12 },
                    { name: "Extensión de Hombro con Polea", sets: 3, reps: 12 },
                    { name: "Abdominales (reps)", sets: 3, reps: 15 }
                ]
            }
        ];

        let currentRoutineIndex = 0;
        let workoutData = {};
        let allHistory = [];

        // Inicializar
        function init() {
            loadData();
            renderExercises();
            updateStats();
            updateNextRoutine();
            updateHistoryPanel();
            setupEventListeners();
            updateDate();
        }

        // Configurar listeners de eventos
        function setupEventListeners() {
            document.querySelectorAll('.routine-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentRoutineIndex = parseInt(e.target.dataset.routine);
                    document.querySelectorAll('.routine-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderExercises();
                });
            });

            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const panelName = e.target.dataset.panel;
                    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
                    document.getElementById(panelName).classList.add('active');
                    e.target.classList.add('active');
                });
            });
        }

        // Renderizar ejercicios
        function renderExercises() {
            const routine = routines[currentRoutineIndex];
            document.getElementById('routineTitle').textContent = routine.name;

            const container = document.getElementById('exercisesContainer');
            container.innerHTML = '';

            routine.exercises.forEach((exercise, idx) => {
                const key = `${currentRoutineIndex}-${idx}`;
                const data = workoutData[key] || { weight: '', reps: '', sets: '' };

                const html = `
                    <div class="exercise-item">
                        <div class="exercise-name">${exercise.name}</div>
                        <div class="exercise-inputs">
                            <div class="input-group">
                                <label>Peso (kg)</label>
                                <input type="number" class="weight" data-key="${key}" value="${data.weight}" placeholder="0">
                            </div>
                            <div class="input-group">
                                <label>Reps × Sets (ej: 10×4)</label>
                                <input type="text" class="reps" data-key="${key}" value="${data.reps}" placeholder="10×4">
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            // Añadir listeners de input
            document.querySelectorAll('.weight, .reps').forEach(input => {
                input.addEventListener('change', (e) => {
                    const key = e.target.dataset.key;
                    const type = e.target.classList.contains('weight') ? 'weight' : 'reps';
                    if (!workoutData[key]) workoutData[key] = {};
                    workoutData[key][type] = e.target.value;
                });
            });
        }

        // Guardar entrenamiento
        function saveWorkout() {
            saveData();
            showToast('Entrenamiento guardado correctamente');
        }

        // Completar y siguiente
        function completeWorkout() {
            const routine = routines[currentRoutineIndex];
            const entry = {
                date: new Date().toLocaleDateString('es-ES'),
                time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                routine: routine.name,
                exercises: []
            };

            routine.exercises.forEach((exercise, idx) => {
                const key = `${currentRoutineIndex}-${idx}`;
                const data = workoutData[key];
                if (data && (data.weight || data.reps)) {
                    entry.exercises.push({
                        name: exercise.name,
                        weight: data.weight,
                        reps: data.reps
                    });
                }
            });

            allHistory.unshift(entry);
            saveData();
            
            // Avanzar a siguiente rutina
            currentRoutineIndex = (currentRoutineIndex + 1) % routines.length;
            workoutData = {};
            
            document.querySelectorAll('.routine-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === currentRoutineIndex);
            });
            
            renderExercises();
            updateStats();
            updateNextRoutine();
            updateHistoryPanel();
            showToast('¡Entrenamiento completado! Siguiente rutina cargada');
        }

        // Actualizar próxima rutina
        function updateNextRoutine() {
            const nextIdx = (currentRoutineIndex + 1) % routines.length;
            document.getElementById('nextRoutine').textContent = routines[nextIdx].name;
        }

        // Actualizar estadísticas
        function updateStats() {
            document.getElementById('totalSessions').textContent = allHistory.length;
        }

        // Actualizar historial
        function updateHistoryPanel() {
            const container = document.getElementById('historyContainer');
            
            if (allHistory.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No hay entrenamientos registrados aún.</p>
                        <p style="font-size: 0.85rem;">Completa tu primer entrenamiento para ver el historial.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allHistory.map((entry, idx) => `
                <div class="history-entry">
                    <div style="font-weight: 600; margin-bottom: 8px;">
                        ${entry.routine}
                    </div>
                    <div class="history-date">
                        ${entry.date} a las ${entry.time}
                    </div>
                    <div style="margin-top: 8px; font-size: 0.85rem; color: var(--text-secondary);">
                        ${entry.exercises.map(ex => `${ex.name}: ${ex.weight || '-'} kg × ${ex.reps || '-'}`).join('<br>')}
                    </div>
                    <button class="btn-danger" style="width: 100%; margin-top: 10px; padding: 6px;" onclick="deleteHistory(${idx})">Eliminar</button>
                </div>
            `).join('');
        }

        // Eliminar entrada del historial
        function deleteHistory(idx) {
            allHistory.splice(idx, 1);
            saveData();
            updateStats();
            updateHistoryPanel();
            showToast('Entrada eliminada');
        }

        // Guardar datos
        function saveData() {
            localStorage.setItem('gymData', JSON.stringify({
                workoutData,
                allHistory,
                currentRoutineIndex
            }));
        }

        // Cargar datos
        function loadData() {
            const saved = localStorage.getItem('gymData');
            if (saved) {
                const data = JSON.parse(saved);
                workoutData = data.workoutData || {};
                allHistory = data.allHistory || [];
                currentRoutineIndex = data.currentRoutineIndex || 0;
            }
        }

        // Exportar datos
        function exportData() {
            const data = {
                workoutData,
                allHistory,
                exportDate: new Date().toLocaleString('es-ES')
            };
            
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gimnasio_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Datos descargados');
        }

        // Resetear (con confirmación)
        function showResetConfirm() {
            if (confirm('¿Estás seguro de que quieres borrar TODOS los datos? Esta acción no se puede deshacer.')) {
                workoutData = {};
                allHistory = [];
                currentRoutineIndex = 0;
                saveData();
                renderExercises();
                updateStats();
                updateHistoryPanel();
                showToast('Todos los datos han sido eliminados');
            }
        }

        // Toast notification
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Actualizar fecha
        function updateDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('workoutDate').textContent = today.toLocaleDateString('es-ES', options);
        }

        // Inicializar app
        init();
    </script>
</body>
</html>
